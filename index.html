"key": "kids-books", "title": "어린이 도서", "items": [{"no": 48, "name": "꼬불꼬불 미로찾기 성경", "color": "", "price": 5500, "list": false, "detail": {"w": 262, "h": 215, "d": 0, "est": false, "specs": [["크기", "가로 262 × 세로 215 mm"], ["쪽수", "32쪽"], ["출판사", "토기장이(토기장이주니어)"]], "feat": ["바벨탑 · 야곱의 사다리 · 다니엘의 사자 굴 등 미로 30개", "미로 속 그림을 보며 성경 이야기도 함께 배움", "그림마다 숨은그림찾기 놀이"], "photos": [["detail/048_1.jpg", "미로 30개"], ["detail/048_2.jpg", "그림 속 성경 이야기 · 숨은그림찾기"]], "intro": "성경으로 놀아요 시리즈. 성경의 주요 내용을 바탕으로 꼬불꼬불 미로찾기 활동을 즐기는 놀이북이다. 동물들이 노아를 찾아가는 길, 아기 모세가 강줄기를 따라가는 길, 에스더가 왕에게 나아가는 길, 요나가 큰 물고기 입 속으로 들어가는 길, 잃은 양 한 마리를 찾아가는 길, 예수님의 무덤으로 달려가는 길 등 30개의 미로가 아름다운 일러스트로 그려져 있다. 또한 각 그림마다 숨은그림찾기도 담겨 있어 보다 재미있게 즐길 수 있다.", "tag": "", "notag": true}, "img": "img/048.jpg"}, {"no": 49, "name": "내가 좋아하는 그림성경", "color": "", "price": 20000, "list": false, "detail": {"w": 173, "h": 203, "d": 0, "est": false, "specs": [["크기", "가로 173 × 세로 203 mm"], ["쪽수", "256쪽"], ["제본", "양장본"], ["지은이", "사라 영"], ["출판사", "생명의말씀사"]], "feat": ["아마존 베스트셀러 『지저스 콜링』의 어린이 버전", "이야기마다 예수님이 직접 들려주시는 말씀 수록", "밝고 따뜻한 색감의 그림"], "photos": [["detail/049_1.jpg", "속지 (천지창조)"], ["detail/049_2.jpg", "속지 · 예수님의 말씀"]], "intro": "은 사라 영의 베스트셀러 을 어린이 그림성경과 접목시킨 것으로, 수년간의 연구와 기도, 묵상의 기록을 통해 완성되었다. 창세기부터 요한계시록까지 성경 이야기를 생생한 그림과 함께 읽을 수 있다. 아이들의 감각에 맞는 예쁜 그림은 읽는 재미를 더하며, 색감이 밝고 따뜻하여 편안한 느낌을 준다.\n그림과 함께 이야기를 읽다 보면, 이야기가 더 생동감 있게 느껴지고 마음속에 오래도록 기억될 것이다. 흥미진진한 성경 이야기를 읽으면서 아이들은 예수님이 늘 이렇게 우리와 매일 매 순간 함께하신다는 것을 깨닫게 될 것이다. 그리고 어떻게 하면 하나님께 영광을 돌리고, 하나님을 기쁘시게 하는 삶을 살 수 있는지를 배우게 될 것이다.", "tag": "", "notag": true}, "img": "img/049.jpg"}, {"no": 50, "name": "또박또박 성경 따라쓰기 세트", "color": "", "price": 34000, "list": false, "detail": {"w": 224, "h": 289, "d": 0, "est": false, "specs": [["크기", "가로 224 × 세로 289 mm"], ["구성", "4권 세트 (구약 2권 · 신약 2권) + 칭찬 스티커 3장"], ["쪽수", "각 88쪽 (총 352쪽)"], ["대상", "초등 저학년"], ["출판사", "생명의말씀사"]], "feat": ["신구약 핵심 성경 이야기 24가지 (권마다 6가지)", "선 긋기 → 자음·모음 → 글자 모양 → 말씀 따라 쓰기 단계별 구성", "성경 속 주요 단어 288개 · 숨은그림찾기 · 미로 찾기 활동", "칭찬 스티커 36개로 성취감을 높여 function parseCsv(t) {
  const rows = []; let row = [], cell = "", inQ = false;
  for (let k = 0; k < t.length; k++) {
    const c = t[k];
    if (inQ) { if (c === '"') { if (t[k + 1] === '"') { cell += '"'; k++; } else inQ = false; } else cell += c; continue; }
    if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[k + 1] === "\n") k++; row.push(cell); rows.push(row); row = []; cell = ""; }

}
function applyCsv(text) {

  DATA.sections.forEach(s => { s.items.forEach(i => byNo[i.no] = i); s.next = []; bySec[s.title] = s; bySec[s.key] = s; });

  rows.forEach(r => {
    const no = parseInt(at(r, "번호"), 10), sec = bySec[at(r, "분류")];

    const i = byNo[no] || { no };

}

    <div class="body"><h3 id="ov-title">${esc(i.name)}</h3><div class="p">${badge(i) ? `<span class="off">${pctOf(i)}% 할인</span>` : ""}${pr(i)}</div>
      <dl class="specs">${specs.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
      ${i.ref ? '<p class="order">참고 사진이에요. 실제 색상이나 판이 조금 다를 수 있어요.</p>' : ""}
      <p class="order">주문하실 때 <b>${i.no}번</b>이라고 말씀해 주세요.</p></div>`;
  ov.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("close").focus();
});
function detailHTML(i) {
  const D = i.detail, k = 0.5;                        // mm → px (A4 비교 그림, 폰 폭에 들어가게)
  const a4w = 210 * k, a4h = 297 * k, bw = D.w * k, bh = D.h * k;
  return `
    <div class="dcover">${i.img ? `<img src="${i.img}" alt="${esc(i.name)} 표지">` : ""}</div>
    <div class="dbody">
      ${!D.notag ? `<span class="tag">${esc(D.tag || i.tr || "개역개정")}</span>` : ""}
      <dl class="specs">${[["색상", i.color]].concat(D.specs).filter(r => r[1]).map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
      ${D.intro ? `<div class="intro"><div class="cap">책 소개</div><p>${esc(D.intro)}</p></div>` : ""}
      ${D.w ? `<div class="cmp">
        <div class="cap">A4 용지와 크기 비교</div>
        <div class="cmp-fig" style="height:${a4h + 26}px">
          <div class="a4" style="width:${a4w}px;height:${a4h}px"><b>A4</b><span>210×297</span></div>
          <div class="bk" style="width:${bw}px;height:${bh}px">${i.img ? `<img src="${i.img}" alt="">` : ""}
            <span class="dw">${D.w}mm</span><span class="dh">${D.h}mm</span></div>
        </div>
      </div>` : ""}
      ${D.feat.length ? `<ul class="feat">${D.feat.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      <div class="dprice"><span>가격${badge(i) ? ` <span class="off">${pctOf(i)}% 할인</span>` : ""}</span><b>${pr(i)}</b></div>
    </div>
    ${D.photos.length ? `<div class="dphotos">${D.photos.map(p => `<figure><img src="${p[0]}" alt="${esc(i.name)} ${esc(p[1])}" loading="lazy">${p[1] ? `<figcaption>${esc(p[1])}</figcaption>` : ""}</figure>`).join("")}</div>` : ""}
    ${D.est ? '<p class="dfoot">* 표시는 추정치예요. 실물을 확인한 뒤 고칠 예정이에요.</p>' : ""}`;
}
function closeOv() { ov.hidden = true; document.body.style.overflow = ""; if (lastFocus) lastFocus.focus(); }
ov.addEventListener("click", e => { if (e.target === ov || e.target.id === "close") closeOv(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !ov.hidden) closeOv(); });
</script>

</body></html>
